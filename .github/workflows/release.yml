name: Release VeloClips

on:
  push:
    tags:
      - 'v*' # Se ejecuta automáticamente cuando subes un tag como v0.1.8
  workflow_dispatch: # Permite ejecutarlo manualmente desde la web de GitHub

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Build and Release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Variables para el actualizador automático
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'VeloClips ${{ github.ref_name }}'
          releaseBody: '🚀 Nueva actualización de VeloClips con IA de ejecución nativa.'
          releaseDraft: false
          prerelease: false